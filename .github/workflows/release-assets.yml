name: Build & Publish Mobile and PC Release Assets

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug signing keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build Android Mobile APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package Mobile APK and PC Installer Bundle
        run: |
          mkdir -p dist/pc-bundle
          cp app/build/outputs/apk/debug/app-debug.apk dist/PushUpRank-Mobile-Android.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/pc-bundle/PushUpRank-Mobile-Android.apk
          cp scripts/install-pc.bat dist/pc-bundle/install-pc.bat
          cp scripts/install-pc.sh dist/pc-bundle/install-pc.sh
          cp README.md dist/pc-bundle/README.md
          (cd dist/pc-bundle && zip -r ../PushUpRank-PC-Installer.zip .)

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PushUpRank-Installers
          path: |
            dist/PushUpRank-Mobile-Android.apk
            dist/PushUpRank-PC-Installer.zip

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('PushUp Rank {0}', github.ref_name) || 'PushUp Rank - Latest Installers' }}
          body: |
            ### Install PushUp Rank
            - **Mobile (Android)**: Download `PushUpRank-Mobile-Android.apk` directly on your Android device and tap to install.
            - **PC (Windows / macOS / Linux)**: Download `PushUpRank-PC-Installer.zip`, extract it, and run `install-pc.bat` (Windows) or `./install-pc.sh` (macOS/Linux) with an Android emulator, Windows Subsystem for Android, Waydroid, or a USB-connected phone.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/PushUpRank-Mobile-Android.apk
            dist/PushUpRank-PC-Installer.zip
